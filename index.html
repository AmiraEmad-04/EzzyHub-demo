<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EzzyHub · Bee Edition</title>
    <style>
        /* ---------- SOFT BLACK & YELLOW · SUBTLE HONEYCOMB EDGES ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d;
            /* faint overall honeycomb – barely visible */
            background-image:
                radial-gradient(circle at 18% 35%, rgba(255, 195, 0, 0.02) 0%, transparent 22%),
                radial-gradient(circle at 82% 68%, rgba(255, 195, 0, 0.02) 0%, transparent 25%),
                repeating-linear-gradient(45deg, rgba(255, 200, 0, 0.01) 0px, rgba(255, 200, 0, 0.01) 2px,
                                          rgba(0,0,0,0) 2px, rgba(0,0,0,0) 14px);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        /* ---------- BEE PATTERNS AT THE EDGES – exactly like the slide ---------- */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            /* honeycomb SVG – single hexagon, repeated at corners and edges */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.15"><path fill="%23e6b422" d="M50 0L93.3 25v50L50 100 6.7 75V25L50 0zm0 5L11.8 27.5v45L50 95l38.2-22.5v-45L50 5z"/><path fill="%23e6b422" d="M50 10l30.1 17.5v35L50 80 19.9 62.5v-35L50 10z"/></svg>'),
                            url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.15"><path fill="%23e6b422" d="M50 0L93.3 25v50L50 100 6.7 75V25L50 0zm0 5L11.8 27.5v45L50 95l38.2-22.5v-45L50 5z"/><path fill="%23e6b422" d="M50 10l30.1 17.5v35L50 80 19.9 62.5v-35L50 10z"/></svg>'),
                            url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.15"><path fill="%23e6b422" d="M50 0L93.3 25v50L50 100 6.7 75V25L50 0zm0 5L11.8 27.5v45L50 95l38.2-22.5v-45L50 5z"/><path fill="%23e6b422" d="M50 10l30.1 17.5v35L50 80 19.9 62.5v-35L50 10z"/></svg>'),
                            url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.15"><path fill="%23e6b422" d="M50 0L93.3 25v50L50 100 6.7 75V25L50 0zm0 5L11.8 27.5v45L50 95l38.2-22.5v-45L50 5z"/><path fill="%23e6b422" d="M50 10l30.1 17.5v35L50 80 19.9 62.5v-35L50 10z"/></svg>'),
                            url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.15"><path fill="%23e6b422" d="M50 0L93.3 25v50L50 100 6.7 75V25L50 0zm0 5L11.8 27.5v45L50 95l38.2-22.5v-45L50 5z"/><path fill="%23e6b422" d="M50 10l30.1 17.5v35L50 80 19.9 62.5v-35L50 10z"/></svg>'),
                            url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.15"><path fill="%23e6b422" d="M50 0L93.3 25v50L50 100 6.7 75V25L50 0zm0 5L11.8 27.5v45L50 95l38.2-22.5v-45L50 5z"/><path fill="%23e6b422" d="M50 10l30.1 17.5v35L50 80 19.9 62.5v-35L50 10z"/></svg>');
            /* positions: four corners + middle of each edge */
            background-position:
                top left, top right, bottom left, bottom right,
                top 50% left 0%, top 50% right 0%,
                left 50% top 0%, left 50% bottom 0%;
            background-repeat: no-repeat;
            background-size: 80px 80px, 80px 80px, 80px 80px, 80px 80px,
                             60px 60px, 60px 60px, 60px 60px, 60px 60px;
            opacity: 0.25;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* ----- HEADER – muted gold, comfortable to read ----- */
        .header {
            text-align: center;
            color: #e6d5a8;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            color: #f0d878;         /* soft honey */
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(240, 200, 80, 0.3);
        }

        .header p {
            font-size: 1.2em;
            color: #d6c28c;         /* muted sand */
            background: rgba(20, 20, 18, 0.7);
            display: inline-block;
            padding: 8px 26px;
            border-radius: 40px;
            border: 1px solid #ba9b4b;
            backdrop-filter: blur(3px);
        }

        /* ----- CARD – dark, slightly transparent, soft yellow border ----- */
        .card {
            background: rgba(18, 18, 18, 0.92);
            backdrop-filter: blur(2px);
            border: 1.5px solid #b5943c;   /* muted gold */
            border-radius: 20px;
            padding: 30px 32px;
            box-shadow: 0 8px 0 #5e4d1a, 0 12px 30px rgba(180, 140, 0, 0.12);
            margin-bottom: 20px;
            color: #eadbba;          /* warm off-white */
        }

        .card h2 {
            color: #efd275;          /* soft yellow */
            margin-bottom: 20px;
            font-size: 1.8em;
            font-weight: 600;
            border-left: 6px solid #b38f40;
            padding-left: 18px;
        }

        /* ----- FORM – easy on the eyes ----- */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ddca94;          /* soft tan */
            font-size: 1.1em;
            letter-spacing: 0.3px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 14px 16px;
            background: #1c1c1a;
            border: 1.5px solid #5e4f2b;
            border-radius: 12px;
            font-size: 14px;
            color: #f0e6ce;          /* very light beige */
            transition: 0.2s;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #cbae5e;
            background: #23231e;
            box-shadow: 0 0 10px rgba(200, 170, 60, 0.3);
        }

        textarea {
            min-height: 250px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            line-height: 1.5;
        }

        /* ----- BUTTON – warm honey, not screaming yellow ----- */
        .btn {
            background: #dbb42c;      /* deep honey */
            border: none;
            border-bottom: 5px solid #8f7320;
            color: #0d0d0d;
            font-weight: 700;
            font-size: 18px;
            padding: 15px 40px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.06s;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 6px 0 #5e4a1a;
        }

        .btn:hover {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #5e4a1a;
            background: #e6c34a;
        }

        .btn:disabled {
            opacity: 0.6;
            transform: none;
            box-shadow: 0 6px 0 #5e4a1a;
        }

        /* ----- LOADING – subtle spinner ----- */
        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .spinner {
            border: 5px solid #3e3a2a;
            border-top: 5px solid #dbb42c;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.2em;
            color: #ddca94;
            margin-top: 10px;
        }

        /* ----- REPORT – consistent muted palette ----- */
        .report {
            display: none;
        }

        .coverage-section {
            text-align: center;
            margin: 30px 0;
        }

        .coverage-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: conic-gradient(
                #e6b422 0%,
                #e6b422 var(--coverage),
                #3e3a2a var(--coverage),
                #3e3a2a 100%
            );
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            border: 4px solid #b38f40;
            box-shadow: 0 0 20px rgba(200, 170, 60, 0.2);
        }

        .coverage-inner {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #181818;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid #c6a34a;
        }

        .coverage-percent {
            font-size: 2.5em;
            font-weight: bold;
            color: #f0d878;
            text-shadow: 0 0 8px rgba(200, 160, 0, 0.4);
        }

        .coverage-label {
            font-size: 0.9em;
            color: #ddca94;
            margin-top: 5px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .stat-card {
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            background: #1c1c1a;
            border-left: 8px solid;
            box-shadow: 0 6px 0 #3a351e;
        }

        .stat-card.implemented {
            border-left-color: #6d946d;
            background: #1e2e1e;
        }

        .stat-card.partial {
            border-left-color: #c4a64a;
            background: #2e2a1a;
        }

        .stat-card.missing {
            border-left-color: #b5766b;
            background: #2e1e1e;
        }

        .stat-number {
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 8px;
            color: #efd275;
            text-shadow: 0 0 8px rgba(200, 160, 0, 0.3);
        }

        .stat-label {
            color: #eadbba;
            font-size: 1.1em;
            font-weight: 500;
        }

        .section-title {
            font-size: 1.5em;
            color: #efd275;
            margin: 30px 0 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #b38f40;
            font-weight: 600;
        }

        .requirement-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: #151512;
            border: 1.5px solid #665522;
            border-radius: 16px;
            overflow: hidden;
        }

        .requirement-table th {
            background: #0f0f0c;
            color: #efd275;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 1em;
            border-bottom: 3px solid #b38f40;
        }

        .requirement-table td {
            padding: 15px;
            border-bottom: 1px solid #4f451e;
            color: #eadbba;
        }

        .requirement-table tr:hover td {
            background: #202018;
        }

        .status-badge {
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.85em;
            font-weight: 600;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge.implemented {
            background: #2a4a2a;
            color: #d4edc9;
            border: 1px solid #8bb38b;
        }

        .status-badge.partial {
            background: #7a5f1a;
            color: #fff4d6;
            border: 1px solid #dbb42c;
        }

        .status-badge.missing {
            background: #6b3a3a;
            color: #ffdede;
            border: 1px solid #c47c7c;
        }

        .alert {
            padding: 20px;
            border-radius: 16px;
            margin: 20px 0;
        }

        .alert.warning {
            background: #2e2815;
            border-left: 8px solid #dbb42c;
            color: #eadbba;
            border: 1px solid #a0863a;
        }

        .issue-list {
            list-style: none;
            padding: 0;
        }

        .issue-list li {
            padding: 12px 20px;
            background: #1e1e18;
            margin: 8px 0;
            border-radius: 12px;
            border-left: 6px solid #c6a34a;
            color: #eadbba;
            font-family: 'Courier New', monospace;
            box-shadow: inset 0 0 0 1px #4f451e;
        }

        .back-btn {
            background: #1f1f1a;
            border: 1.5px solid #b38f40;
            color: #efd275;
            font-weight: 600;
            padding: 12px 32px;
            font-size: 16px;
            border-radius: 40px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.1s;
            box-shadow: 0 5px 0 #5e4d1a;
        }

        .back-btn:hover {
            background: #0f0f0a;
            color: #f3e3a2;
            border-color: #dbb42c;
            transform: translateY(3px);
            box-shadow: 0 2px 0 #5e4d1a;
        }

        .req-text {
            font-size: 0.95em;
            color: #eadbba;
        }

        /* ------ everything else 100% original – untouched ------ */
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>EzzyHub</h1>
        <p>AI-Powered Code Verification System</p>
    </div>

    <!-- Input Section – exactly as original -->
    <div class="card" id="inputSection">
        <h2>Project Analysis</h2>

        <div class="form-group">
            <label for="zipFile">Zip file</label>
            <input
                    type="text"
                    id="zipFile"
                    placeholder="YourPath\YourProject"
                    value="">
        </div>

        <div class="form-group">
            <label for="requirements">Functional Requirements</label>
            <textarea
                    id="requirements"
                    placeholder="Paste your requirements here (e.g., REQ-ADD-1, REQ-DIV-4, etc.)"></textarea>
        </div>

        <button class="btn" onclick="analyzeCode()">
            🔍 Analyze Code
        </button>
    </div>

    <!-- Loading Section -->
    <div class="card loading" id="loadingSection">
        <div class="spinner"></div>
        <p class="loading-text">Analyzing your code...</p>
        <p style="color: #ddca94; margin-top: 10px;">This may take 15-30 seconds</p>
    </div>

    <!-- Report Section -->
    <div class="card report" id="reportSection">
        <h2>📊 Verification Report</h2>

        <div class="coverage-section">
            <div class="coverage-circle" id="coverageCircle">
                <div class="coverage-inner">
                    <div class="coverage-percent" id="coveragePercent">0%</div>
                    <div class="coverage-label">Coverage</div>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card implemented">
                <div class="stat-number" id="implementedCount">0</div>
                <div class="stat-label">✅ Implemented</div>
            </div>
            <div class="stat-card partial">
                <div class="stat-number" id="partialCount">0</div>
                <div class="stat-label">🟡 Partial</div>
            </div>
            <div class="stat-card missing">
                <div class="stat-number" id="missingCount">0</div>
                <div class="stat-label">❌ Missing</div>
            </div>
        </div>

        <div id="importIssuesSection"></div>

        <h3 class="section-title">📋 Requirements Analysis</h3>
        <div style="overflow-x: auto;">
            <table class="requirement-table" id="requirementTable">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Requirement</th>
                    <th>Status</th>
                    <th>Match Score</th>
                    <th>Matched Feature</th>
                </tr>
                </thead>
                <tbody id="requirementBody">
                </tbody>
            </table>
        </div>

        <div id="suggestionsSection"></div>

        <button class="back-btn" onclick="resetForm()">
            ← Analyze Another Project
        </button>
    </div>
</div>

<!-- ORIGINAL JAVASCRIPT – 100% UNCHANGED -->
<script>
    async function analyzeCode() {
const zipFile = document.getElementById('zipFile').value.trim();
const requirements = document.getElementById('requirements').value.trim();

if (!zipFile || !requirements) {
    alert('⚠️ Please fill in both fields!');
    return;
}

// Show loading
document.getElementById('inputSection').style.display = 'none';
document.getElementById('loadingSection').style.display = 'block';
document.getElementById('reportSection').style.display = 'none';

try {
    console.log('Sending request to backend...');
    console.log('URL:', zipFile);
    console.log('Requirements:', requirements);

    const response = await fetch('http://localhost:8080/api/verify', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
        },
        body: JSON.stringify({
            zipFile: zipFile,
            requirements: requirements
        })
    });

    console.log('Response status:', response.status);
    console.log('Response headers:', response.headers);

    if (!response.ok) {
        // Get error details
        const errorText = await response.text();
        console.error('Error response:', errorText);
        throw new Error(`Server returned ${response.status}: ${errorText}`);
    }

    const report = await response.json();
    console.log('Received report:', report);
    displayReport(report);

} catch (error) {
    console.error('Full error:', error);

    let errorMessage = 'Unknown error occurred';

    if (error.message.includes('Failed to fetch')) {
        errorMessage = 'Cannot connect to backend!\n\n' +
                      'Please make sure:\n' +
                      '1. Backend is running (check http://localhost:8080/api/health)\n' +
                      '2. No firewall is blocking the connection\n' +
                      '3. CORS is properly configured\n\n' +
                      'Error: ' + error.message;
    } else {
        errorMessage = error.message;
    }

    alert('❌ ' + errorMessage);
    document.getElementById('inputSection').style.display = 'block';
    document.getElementById('loadingSection').style.display = 'none';
}
}

    function displayReport(report) {
        // Hide loading, show report
        document.getElementById('loadingSection').style.display = 'none';
        document.getElementById('reportSection').style.display = 'block';

        // Update coverage
        const coverage = Math.round(report.coveragePercentage);
        document.getElementById('coveragePercent').textContent = coverage + '%';
        document.getElementById('coverageCircle').style.setProperty('--coverage', coverage + '%');

        // Update stats
        document.getElementById('implementedCount').textContent = report.implementedRequirements;
        document.getElementById('partialCount').textContent = report.partialRequirements;
        document.getElementById('missingCount').textContent = report.missingRequirements;

        // Display import issues
        if (report.importIssues && report.importIssues.length > 0) {
            const issuesHtml = `
                <div class="alert warning">
                    <h4>⚠️ Import Issues Detected (${report.importIssues.length})</h4>
                    <ul class="issue-list">
                        ${report.importIssues.map(issue =>
                            `<li><strong>${issue.className}:</strong> Missing import for <code>${issue.missingImport}</code></li>`
                        ).join('')}
                    </ul>
                </div>
            `;
            document.getElementById('importIssuesSection').innerHTML = issuesHtml;
        } else {
            document.getElementById('importIssuesSection').innerHTML =
                '<div class="alert" style="background: #1e3a1e; border-left: 5px solid #28a745; color: #155724;"><h4>✅ No Import Issues Detected</h4></div>';
        }

        // Display requirements
        const tbody = document.getElementById('requirementBody');
        tbody.innerHTML = '';

        report.requirements.forEach(req => {
            const row = tbody.insertRow();
            const reqTextShort = req.text.length > 100 ? req.text.substring(0, 100) + '...' : req.text;
            row.innerHTML = `
                <td><strong>${req.id}</strong></td>
                <td class="req-text">${reqTextShort}</td>
                <td><span class="status-badge ${req.status.toLowerCase()}">${req.status}</span></td>
                <td>${Math.round(req.matchScore * 100)}%</td>
                <td>${req.matchedFeature || '-'}</td>
            `;
        });

        // Display suggestions
        if (report.suggestions && report.suggestions.length > 0) {
            const suggestionsHtml = `
                <h3 class="section-title">💡 Suggestions (${report.suggestions.length})</h3>
                <ul class="issue-list">
                    ${report.suggestions.map(s => `<li>${s}</li>`).join('')}
                </ul>
            `;
            document.getElementById('suggestionsSection').innerHTML = suggestionsHtml;
        }

        // Scroll to top of report
        document.getElementById('reportSection').scrollIntoView({ behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById('reportSection').style.display = 'none';
        document.getElementById('inputSection').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
</body>
</html>
